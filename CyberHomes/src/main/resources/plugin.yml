name: CyberHomes
version: '${version}'

main: me.sbpro.cyberhomes.CyberHomes
api-version: '26.2'
load: POSTWORLD

authors: [ SBPro ]

commands:
  homes:
    description: Opens and manages homes
    usage: /homes [home] or /homes view <player>

  sethome:
    description: Creates a home
    usage: /sethome <name>
    aliases:
      - createhome
      - addhome

  delhome:
    description: Deletes a home
    usage: /delhome <name>
    aliases:
      - deletehome
      - removehome

permissions:
  cyber.homes.staff:
    default: op

  cyber.homes.1:
    default: true
  cyber.homes.2:
    default: true
  cyber.homes.3:
    default: op
  cyber.homes.4:
    default: op
  cyber.homes.5:
    default: op
  cyber.homes.6:
    default: op
  cyber.homes.7:
    default: op