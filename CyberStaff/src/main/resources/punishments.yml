# ============================================================
# CyberStaff punishments
# ============================================================
# Based on the CyberMC Minecraft Rules document.
#
# tiers:   punishment ladders. Each new offence in a tier moves
#          the player one step up that tier's ladder.
#          type: WARNING, MUTE or BAN
#          duration: m, h, d, w, mo, y or "permanent"
#
# reasons: what staff pick with /offend <player> <reason>.
#          "name" is what staff type / tab-complete and what the
#          player sees. "tier" must be one of the tiers below.
#
# Staff can also give a custom reason with a tier:
#   /offend <player> #GAME_1 <your own reason>
# ============================================================

tiers:
  CHAT_1:
    display-name: "Chat 1"
    offences:
      1:
        type: "WARNING"
      2:
        type: "MUTE"
        duration: "30m"
      3:
        type: "MUTE"
        duration: "1h"
      4:
        type: "MUTE"
        duration: "12h"
      5:
        type: "MUTE"
        duration: "1d"
      6:
        type: "MUTE"
        duration: "7d"
      7:
        type: "BAN"
        duration: "7d"

  CHAT_2:
    display-name: "Chat 2"
    offences:
      1:
        type: "MUTE"
        duration: "6h"
      2:
        type: "MUTE"
        duration: "12h"
      3:
        type: "BAN"
        duration: "1d"
      4:
        type: "BAN"
        duration: "7d"
      5:
        type: "BAN"
        duration: "31d"
      6:
        type: "BAN"
        duration: "6mo"
      7:
        type: "BAN"
        duration: "permanent"

  GAME_1:
    display-name: "Game 1"
    offences:
      1:
        type: "WARNING"
      2:
        type: "BAN"
        duration: "1d"
      3:
        type: "BAN"
        duration: "3d"
      4:
        type: "BAN"
        duration: "7d"
      5:
        type: "BAN"
        duration: "14d"
      6:
        type: "BAN"
        duration: "30d"
      7:
        type: "BAN"
        duration: "6mo"

  GAME_2:
    display-name: "Game 2"
    offences:
      1:
        type: "WARNING"
      2:
        type: "BAN"
        duration: "7d"
      3:
        type: "BAN"
        duration: "14d"
      4:
        type: "BAN"
        duration: "30d"
      5:
        type: "BAN"
        duration: "6mo"
      6:
        type: "BAN"
        duration: "permanent"

  GAME_3:
    display-name: "Game 3"
    offences:
      1:
        type: "BAN"
        duration: "60d"
      2:
        type: "BAN"
        duration: "90d"
      3:
        type: "BAN"
        duration: "permanent"

  GAME_4:
    display-name: "Game 4"
    offences:
      1:
        type: "BAN"
        duration: "permanent"

