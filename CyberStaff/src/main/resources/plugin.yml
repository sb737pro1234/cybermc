name: CyberStaff
version: 1.0
main: me.sbpro.cyberstaff.CyberStaff
api-version: '26.2'
description: Cyber network-wide custom staff punishment system.
author: SBPro

commands:

  offend:
    description: Issue a punishment.
    usage: /offend <player> <reason>
    permission: cyber.staff

  offence:
    description: Manage offences and SUS notes.
    usage: /offence <new|check|list|change|remove|reset|sus>

  sus:
    description: View and manage SUS notes.
    usage: /sus [add|remove]

  cyberstaff:
    description: CyberStaff administration command.
    usage: /cyberstaff <reload>
    permission: cyber.staff
    aliases:
      - grassggstaff

  ban:
    description: Redirects to the offence system.
    usage: /ban

  mute:
    description: Staff mute command.
    usage: /mute

  warn:
    description: Staff warning command.
    usage: /warn

  punish:
    description: Staff punishment command.
    usage: /punish

  chatlock:
    description: Lock or unlock chat.
    usage: /chatlock

  staffchat:
    description: Toggle staff chat.
    usage: /staffchat
    permission: cyber.staff.chat

  clearchat:
    description: Clears the public chat.
    usage: /clearchat
    permission: cyber.staff.clearchat

  sign:
    description: Signs the item in your hand.
    usage: /sign
    permission: cyber.staff.sign

  staffguide:
    permission: cyber.staff
    description: Shows staff tutorial
    aliases:
      - stafftutorial

permissions:

  cyber.staff:
    default: op

  cyber.staff.check:
    default: op

  cyber.staff.change:
    default: op

  cyber.staff.remove:
    default: op

  cyber.staff.reset:
    default: op

  cyber.staff.exempt:
    default: op

  cyber.staff.sus:
    default: op
    children:
      cyber.staff.sus.add: true
      cyber.staff.sus.remove: true

  cyber.staff.sus.add:
    default: op

  cyber.staff.sus.remove:
    default: op

  cyber.staff.chat:
    default: op

  cyber.staff.clearchat:
    default: op

  cyber.staff.sign:
    default: op