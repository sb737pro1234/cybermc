# ============================================================
# CyberStaff — network punishment system
# ============================================================
# Use ONE database for every Cyber backend server.
# Do not create plugin tables manually; CyberStaff creates
# them automatically on startup.
#
# PebbleHost: Game Panel -> MySQL Databases
# Copy the Host, Port, Database Name, Username and password
# shown by PebbleHost below.
#
# IMPORTANT: never share or commit your database password.
# ============================================================
# ============================================================
# CyberStaff Database
# ============================================================
# type: sqlite (default) stores everything in a local file inside
#       plugins/CyberStaff/ (see sqlite-file below).
# type: mysql   uses ONE shared MySQL/MariaDB database, so every
#       backend server sees the same offences. The database/schema
#       must already exist; CyberStaff creates its own tables.
#
# The MySQL settings below are only used when type is "mysql".
# Replace the placeholder values with the details shown by your
# database host. If "type" is missing, SQLite is used.
# ============================================================
database:
  type: "sqlite"
  sqlite-file: "staff.db"
  host: "YOUR-MYSQL-HOST"
  port: 3306
  database: "YOUR-DATABASE-NAME"
  username: "YOUR-MYSQL-USERNAME"
  password: "YOUR-MYSQL-PASSWORD"
  pool-size: 10
  use-ssl: false
  connection-timeout-ms: 10000
  idle-timeout-ms: 600000
  max-lifetime-ms: 1800000

offence-counting:
  mode: "PER_TIER"

synchronisation:
  enabled: true
  poll-seconds: 3

general:
  debug: false
  date-format: "dd/MM/yyyy HH:mm"
  unknown-player-message: true
