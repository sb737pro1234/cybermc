# =============================================================
# CyberMastery - categories, groups and types
#
# unit     = the category's level unit. Level n costs unit x shape(n),
#            where shape = 1, 2, 4, 6, 8 ... (+2 per level). Level 45 = 1981 x unit.
# points   = points one action gives for that type (rarer = more points).
# includes = shown in the type's lore.
# match    = block / item materials (or entity types for slaying) that count
#            as this type. "*" is a wildcard, e.g. "*_WOOL".
#            Exact names are matched before wildcards.
#
# Type ids (the keys, e.g. "stone") must be unique across all categories.
# They are used in player data files and in %cybermastery_level_<type>%.
# =============================================================

categories:

