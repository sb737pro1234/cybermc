name: CyberCoins
version: 1.0
main: me.sbpro.cybercoins.CyberCoins
description: Cyber second currency plugin.
author: SBPro
api-version: '26.2'
softdepend:
  - PlaceholderAPI

commands:
  coins:
    description: View your CyberCoins balance and information.
    usage: /coins [shop|top|give|take|set|balance|withdraw|pay|reload]
    aliases:
      - coin
      - c
  coinshop:
    description: Open the Cyber coin shop.
    usage: /coinshop
    aliases:
      - coinsshop
  withdrawcoins:
    description: Withdraw coins into a bank note.
    usage: /withdrawcoins <amount>
    aliases:
    - coinswithdraw
    - coinwithdraw
  coinstop:
    description: View the top Cyber coin balances.
    usage: /coinstop
    aliases:
      - cointop
  paycoins:
    description: Pay coins to another player.
    usage: /paycoins <player> <amount>
    aliases: []

permissions:
  cyber.coins.use:
    description: Allows use of the /coins command.
    default: true
  cyber.coins.shop:
    description: Allows use of the coin shop.
    default: true
  cyber.coins.withdraw:
    description: Allows withdrawing coins into bank notes.
    default: true
  cyber.coins.pay:
    description: Allows players to pay coins to other players.
    default: true
  cyber.coins.give:
    description: Allows giving coins to players.
    default: op
  cyber.coins.take:
    description: Allows taking coins from players.
    default: op
  cyber.coins.set:
    description: Allows setting player coin balances.
    default: op
  cyber.coins.balance.others:
    description: Allows checking another player's coin balance.
    default: true
  cyber.coins.shop.setdisplayitem:
    description: Allows setting a shop item's display item.
    default: op
  cyber.coins.reload:
    description: Allows reloading CyberCoins configuration.
    default: op
