name: CyberAnnouncements
version: 1.0.0
main: me.sbpro.cyberannouncements.CyberAnnouncements
api-version: '26.2'

commands:
  announcements:
    description: Manage Cyber announcements
    usage: /announcements reload
    permission: cyber.announcements.admin
  announce:
    description: Sends an announcement to the server
    usage: /announce <announcement>
    permission: cyber.announce
  livestream:
    aliases:
      - livestreamannounce
      - announcelivestream
      - stream
    permission: cyber.media.announce
  content:
    aliases:
      - contentannounce
      - announcecontent
      - video
      - short
    permission: cyber.media.announce


permissions:
  cyber.announcements.admin:
    description: Allows management of Cyber announcements
    default: op
  cyber.announce:
    description: Allows the player to send server announcements
    default: op
  cyber.media.announce:
    default: op
    description: Allows a media rank or above use /livestream.